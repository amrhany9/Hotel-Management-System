@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
    <!-- Backdrop -->
    <div
      class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm transition-opacity duration-200"
      (click)="onBackdropClick()"
    ></div>

    <!-- Modal Dialog -->
    <div
      class="relative w-full bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 rounded-3xl shadow-modal overflow-hidden z-10 transition-all transform animate-fade-scale-in flex flex-col max-h-[90vh]"
      [class]="modalSizeClass"
    >
      <!-- Header -->
      <div class="px-6 py-5 sm:px-8 border-b border-slate-100 dark:border-slate-800 border-s-4 border-s-primary-600 flex items-center justify-between gap-4 bg-slate-50/50 dark:bg-slate-850/50">
        <div>
          <h3 class="text-base sm:text-lg font-bold text-slate-900 dark:text-slate-100 tracking-tight">
            {{ title }}
          </h3>
          @if (subtitle) {
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{{ subtitle }}</p>
          }
        </div>

        <button
          type="button"
          (click)="close()"
          class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Body -->
      <div class="p-6 sm:p-8 overflow-y-auto flex-1">
        <ng-content></ng-content>
      </div>

      <!-- Footer -->
      <div class="empty:hidden px-6 py-4 sm:px-8 border-t border-slate-100 dark:border-slate-800 bg-transparent flex items-center justify-end gap-3">
        <ng-content select="[slot=footer]"></ng-content>
      </div>
    </div>
  </div>
}
