<span [class]="badgeClasses">
  @if (dot) {
    @if (pulse) {
      <span class="relative flex h-2 w-2 me-1.5">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" [class]="dotColor"></span>
        <span class="relative inline-flex rounded-full h-2 w-2" [class]="dotColor"></span>
      </span>
    } @else {
      <span class="w-1.5 h-1.5 rounded-full me-1.5" [class]="dotColor"></span>
    }
  }
  <ng-content></ng-content>
</span>
