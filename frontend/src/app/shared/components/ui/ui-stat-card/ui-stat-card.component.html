<div
  class="relative overflow-hidden bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800/80 rounded-2xl p-5 sm:p-6 shadow-card hover:shadow-card-hover hover:border-slate-300 dark:hover:border-slate-700 transition-all duration-300 group hover:-translate-y-0.5"
>
  <div class="relative flex items-start justify-between gap-4">
    <div class="flex-1 min-w-0">
      <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5 truncate">
        {{ label }}
      </p>
      <div class="flex items-baseline gap-2">
        <h4 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">
          {{ value }}
        </h4>
        @if (unit) {
          <span class="text-xs font-bold text-slate-400">{{ unit }}</span>
        }
      </div>
      
      <div class="mt-2 flex items-center gap-2">
        @if (trend && trendValue) {
          <span
            class="inline-flex items-center gap-0.5 text-[11px] font-bold px-1.5 py-0.5 rounded-md"
            [class.bg-emerald-50]="trend === 'up'"
            [class.text-emerald-700]="trend === 'up'"
            [class.bg-rose-50]="trend === 'down'"
            [class.text-rose-700]="trend === 'down'"
            [class.bg-slate-100]="trend === 'neutral'"
            [class.text-slate-600]="trend === 'neutral'"
          >
            @if (trend === 'up') {
              <svg class="w-3 h-3 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
              </svg>
            } @else if (trend === 'down') {
              <svg class="w-3 h-3 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
              </svg>
            }
            {{ trendValue }}
          </span>
        }
        @if (subtitle) {
          <p class="text-xs text-slate-500 dark:text-slate-400 truncate">
            {{ subtitle }}
          </p>
        }
      </div>
    </div>

    <div [class]="iconContainerClasses">
      <ng-content select="[slot=icon]"></ng-content>
    </div>
  </div>

  <!-- Accent bottom gradient bar -->
  <div [class]="accentBarClasses"></div>
</div>
