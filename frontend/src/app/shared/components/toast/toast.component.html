<div class="fixed bottom-5 end-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none p-4">
  @for (toast of notificationService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 p-4 rounded-2xl shadow-xl border bg-white dark:bg-slate-900 transition-all duration-300 transform animate-in slide-in-from-bottom-5"
      [class.border-emerald-200]="toast.type === 'success'"
      [class.dark:border-emerald-800]="toast.type === 'success'"
      [class.border-rose-200]="toast.type === 'error'"
      [class.dark:border-rose-800]="toast.type === 'error'"
      [class.border-primary-200]="toast.type === 'info'"
      [class.dark:border-primary-800]="toast.type === 'info'"
      [class.border-amber-200]="toast.type === 'warning'"
      [class.dark:border-amber-800]="toast.type === 'warning'"
    >
      <!-- Icon -->
      <div class="shrink-0 mt-0.5">
        @switch (toast.type) {
          @case ('success') {
            <div class="w-7 h-7 rounded-full bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
          }
          @case ('error') {
            <div class="w-7 h-7 rounded-full bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 flex items-center justify-center">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </div>
          }
          @case ('warning') {
            <div class="w-7 h-7 rounded-full bg-amber-100 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center justify-center">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
              </svg>
            </div>
          }
          @default {
            <div class="w-7 h-7 rounded-full bg-primary-100 dark:bg-primary-950/60 text-primary-600 dark:text-primary-400 flex items-center justify-center">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
          }
        }
      </div>

      <!-- Content -->
      <div class="flex-1 min-w-0">
        @if (toast.title) {
          <h5 class="text-xs font-bold text-slate-900 dark:text-slate-100 leading-snug">
            {{ toast.title }}
          </h5>
        }
        <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed break-words mt-0.5">
          {{ toast.message }}
        </p>
      </div>

      <!-- Close -->
      <button
        type="button"
        (click)="notificationService.remove(toast.id)"
        class="shrink-0 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-lg transition"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  }
</div>
